<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 320 120" width="320" height="120">
  <defs>
    <linearGradient id="goldGrad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#FFF2A3"/>
      <stop offset="30%" stop-color="#FFD700"/>
      <stop offset="60%" stop-color="#D49B00"/>
      <stop offset="85%" stop-color="#B87333"/>
      <stop offset="100%" stop-color="#804A00"/>
    </linearGradient>
    <linearGradient id="goldStroke" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#FFFFFF"/>
      <stop offset="50%" stop-color="#FFD700"/>
      <stop offset="100%" stop-color="#8A5A00"/>
    </linearGradient>
    <radialGradient id="goldGlow" cx="50%" cy="50%" r="50%">
      <stop offset="0%" stop-color="#FFD700" stop-opacity="0.6"/>
      <stop offset="70%" stop-color="#FF9900" stop-opacity="0.2"/>
      <stop offset="100%" stop-color="#000000" stop-opacity="0"/>
    </radialGradient>
    <filter id="shadow" x="-20%" y="-20%" width="140%" height="140%">
      <feDropShadow dx="0" dy="3" stdDeviation="3" flood-color="#000000" flood-opacity="0.9"/>
    </filter>
  </defs>

  <!-- Background glow -->
  <circle cx="160" cy="60" r="70" fill="url(#goldGlow)"/>

  <!-- Left Die -->
  <g transform="translate(25, 38) rotate(-15)" filter="url(#shadow)">
    <rect x="0" y="0" width="30" height="30" rx="6" fill="#1A1A1A" stroke="url(#goldStroke)" stroke-width="2"/>
    <circle cx="9" cy="9" r="2.8" fill="#FFD700"/>
    <circle cx="21" cy="9" r="2.8" fill="#FFD700"/>
    <circle cx="9" cy="21" r="2.8" fill="#FFD700"/>
    <circle cx="21" cy="21" r="2.8" fill="#FFD700"/>
    <circle cx="15" cy="15" r="2.8" fill="#FFF2A3"/>
  </g>

  <!-- Right Die -->
  <g transform="translate(265, 38) rotate(15)" filter="url(#shadow)">
    <rect x="0" y="0" width="30" height="30" rx="6" fill="#1A1A1A" stroke="url(#goldStroke)" stroke-width="2"/>
    <circle cx="8" cy="8" r="2.8" fill="#FFD700"/>
    <circle cx="15" cy="15" r="2.8" fill="#FFF2A3"/>
    <circle cx="22" cy="22" r="2.8" fill="#FFD700"/>
  </g>

  <!-- Crown on Top -->
  <g transform="translate(130, 2)" filter="url(#shadow)">
    <path d="M 0,26 L 6,10 L 16,18 L 30,2 L 44,18 L 54,10 L 60,26 Z" fill="url(#goldGrad)" stroke="#FFE87C" stroke-width="1.2"/>
    <rect x="3" y="24" width="54" height="6" rx="2" fill="url(#goldGrad)" stroke="#573800" stroke-width="0.8"/>
    <!-- Jewels on crown -->
    <circle cx="6" cy="10" r="2.2" fill="#E60000"/>
    <circle cx="30" cy="2" r="3.2" fill="#00E5FF"/>
    <circle cx="54" cy="10" r="2.2" fill="#E60000"/>
    <circle cx="15" cy="27" r="1.8" fill="#FFD700"/>
    <circle cx="30" cy="27" r="1.8" fill="#FFD700"/>
    <circle cx="45" cy="27" r="1.8" fill="#FFD700"/>
  </g>

  <!-- Main Crest Plaque & Frame -->
  <g filter="url(#shadow)">
    <!-- Outer ornate ribbon border -->
    <path d="M 60,42 C 100,32 220,32 260,42 C 275,58 275,76 260,94 C 220,104 100,104 60,94 C 45,76 45,58 60,42 Z"
          fill="#0D0D14" stroke="url(#goldStroke)" stroke-width="3"/>
    <path d="M 66,46 C 102,38 218,38 254,46 C 267,60 267,74 254,88 C 218,98 102,98 66,88 C 53,74 53,60 66,46 Z"
          fill="#141424" stroke="url(#goldGrad)" stroke-width="1"/>
  </g>

  <!-- Logo Typography -->
  <g filter="url(#shadow)">
    <text x="160" y="66" font-family="'Cinzel', 'Trajan Pro', 'Georgia', serif" font-weight="900" font-size="25"
          fill="url(#goldGrad)" stroke="#3A2200" stroke-width="1.5" text-anchor="middle" letter-spacing="3.5">
      ROYAL
    </text>
    <text x="160" y="89" font-family="'Cinzel', 'Trajan Pro', 'Arial Black', sans-serif" font-weight="900" font-size="21"
          fill="url(#goldGrad)" stroke="#3A2200" stroke-width="1.2" text-anchor="middle" letter-spacing="4">
      LUDO
    </text>
  </g>

  <!-- Sparkles -->
  <polygon points="160,34 163,38 167,38 164,41 165,45 160,42 155,45 156,41 153,38 157,38" fill="#FFF8C4"/>
</svg>
