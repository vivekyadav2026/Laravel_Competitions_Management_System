<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 300 300" width="300" height="300">
  <defs>
    <radialGradient id="bgSphere" cx="50%" cy="30%" r="70%">
      <stop offset="0%" stop-color="#1E2A4A"/>
      <stop offset="60%" stop-color="#0B132B"/>
      <stop offset="100%" stop-color="#040817"/>
    </radialGradient>
    <linearGradient id="goldPlate" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#FFF2A3"/>
      <stop offset="50%" stop-color="#FFD700"/>
      <stop offset="100%" stop-color="#8A5A00"/>
    </linearGradient>
    <filter id="shadow3d">
      <feDropShadow dx="0" dy="6" stdDeviation="5" flood-color="#000" flood-opacity="0.8"/>
    </filter>
  </defs>

  <!-- Card Background -->
  <rect width="300" height="300" rx="20" fill="url(#bgSphere)"/>
  
  <!-- Outer subtle glowing border -->
  <rect x="2" y="2" width="296" height="296" rx="18" fill="none" stroke="#00D2FF" stroke-width="1.5" stroke-opacity="0.4"/>

  <!-- Starry sparkles background -->
  <circle cx="40" cy="50" r="1.5" fill="#FFF"/>
  <circle cx="260" cy="80" r="1.5" fill="#FFF"/>
  <circle cx="80" cy="220" r="1.2" fill="#00D2FF"/>
  <circle cx="240" cy="240" r="1.5" fill="#FFD700"/>

  <!-- 3D Perspective Ludo Board -->
  <g transform="translate(150, 185) scale(0.9, 0.55) rotate(45)" filter="url(#shadow3d)">
    <!-- Board Base -->
    <rect x="-90" y="-90" width="180" height="180" rx="14" fill="#FFFFFF" stroke="url(#goldPlate)" stroke-width="6"/>
    <!-- Red Home Base (Top Left) -->
    <rect x="-85" y="-85" width="70" height="70" rx="8" fill="#EF4444"/>
    <circle cx="-50" cy="-50" r="22" fill="#FFFFFF"/>
    <circle cx="-50" cy="-50" r="16" fill="#DC2626"/>
    <!-- Green Home Base (Top Right) -->
    <rect x="15" y="-85" width="70" height="70" rx="8" fill="#10B981"/>
    <circle cx="50" cy="-50" r="22" fill="#FFFFFF"/>
    <circle cx="50" cy="-50" r="16" fill="#059669"/>
    <!-- Yellow Home Base (Bottom Right) -->
    <rect x="15" y="15" width="70" height="70" rx="8" fill="#F59E0B"/>
    <circle cx="50" cy="50" r="22" fill="#FFFFFF"/>
    <circle cx="50" cy="50" r="16" fill="#D97706"/>
    <!-- Blue Home Base (Bottom Left) -->
    <rect x="-85" y="15" width="70" height="70" rx="8" fill="#3B82F6"/>
    <circle cx="-50" cy="50" r="22" fill="#FFFFFF"/>
    <circle cx="-50" cy="50" r="16" fill="#2563EB"/>
    <!-- Center Triangles -->
    <polygon points="0,0 -15,-15 15,-15" fill="#10B981"/>
    <polygon points="0,0 15,-15 15,15" fill="#F59E0B"/>
    <polygon points="0,0 -15,15 15,15" fill="#3B82F6"/>
    <polygon points="0,0 -15,-15 -15,15" fill="#EF4444"/>
  </g>

  <!-- Left 3D Red Die -->
  <g transform="translate(25, 80) rotate(-18)" filter="url(#shadow3d)">
    <rect width="40" height="40" rx="8" fill="#DC2626" stroke="#FCA5A5" stroke-width="1.5"/>
    <circle cx="12" cy="12" r="3.5" fill="#FFF"/>
    <circle cx="28" cy="28" r="3.5" fill="#FFF"/>
    <circle cx="20" cy="20" r="3.5" fill="#FFF"/>
  </g>

  <!-- Right 3D Gold Die -->
  <g transform="translate(235, 120) rotate(22)" filter="url(#shadow3d)">
    <rect width="38" height="38" rx="8" fill="url(#goldPlate)" stroke="#FFF" stroke-width="1.5"/>
    <circle cx="11" cy="11" r="3.2" fill="#451A03"/>
    <circle cx="27" cy="11" r="3.2" fill="#451A03"/>
    <circle cx="11" cy="27" r="3.2" fill="#451A03"/>
    <circle cx="27" cy="27" r="3.2" fill="#451A03"/>
  </g>

  <!-- Title Ribbon -->
  <g filter="url(#shadow3d)">
    <text x="150" y="80" font-family="'Cinzel', 'Poppins', sans-serif" font-weight="900" font-size="28"
          fill="url(#goldPlate)" text-anchor="middle" letter-spacing="2">
      ROYAL LUDO
    </text>
    <rect x="90" y="94" width="120" height="24" rx="12" fill="#000" stroke="#00D2FF" stroke-width="1"/>
    <text x="150" y="110" font-family="'Arial Black', sans-serif" font-weight="900" font-size="12"
          fill="#00D2FF" text-anchor="middle" letter-spacing="3">
      CLASSIC
    </text>
  </g>
</svg>
