<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 300 300" width="300" height="300">
  <defs>
    <radialGradient id="bgDark" cx="50%" cy="40%" r="70%">
      <stop offset="0%" stop-color="#181512"/>
      <stop offset="60%" stop-color="#0E0B08"/>
      <stop offset="100%" stop-color="#040302"/>
    </radialGradient>
    <linearGradient id="goldText" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#FFF2A3"/>
      <stop offset="50%" stop-color="#FFD700"/>
      <stop offset="100%" stop-color="#B8860B"/>
    </linearGradient>
    <radialGradient id="goldGlow" cx="50%" cy="50%" r="50%">
      <stop offset="0%" stop-color="#FFD700" stop-opacity="0.3"/>
      <stop offset="100%" stop-color="#FFD700" stop-opacity="0"/>
    </radialGradient>
    <filter id="shadow">
      <feDropShadow dx="0" dy="4" stdDeviation="4" flood-color="#000" flood-opacity="0.8"/>
    </filter>
  </defs>

  <!-- Background -->
  <rect width="300" height="300" rx="20" fill="url(#bgDark)"/>
  <rect x="2" y="2" width="296" height="296" rx="18" fill="none" stroke="#FFD700" stroke-width="1.2" stroke-opacity="0.3"/>

  <!-- Golden Ambient Glow behind Icon -->
  <circle cx="150" cy="115" r="80" fill="url(#goldGlow)"/>

  <!-- Ornate Golden Ring with WhatsApp Icon -->
  <g transform="translate(150, 115)" filter="url(#shadow)">
    <!-- Outer gold ring -->
    <circle cx="0" cy="0" r="54" fill="#0A0806" stroke="url(#goldText)" stroke-width="3.5"/>
    <circle cx="0" cy="0" r="48" fill="#140E05" stroke="#FFE066" stroke-width="1" stroke-dasharray="4 2"/>
    
    <!-- WhatsApp / Headset bubble -->
    <path d="M -24,8 C -26,1 -24,-7 -18,-14 C -12,-21 -3,-25 6,-25 C 16,-25 25,-21 31,-14 C 37,-7 39,2 37,11 C 34,20 27,27 18,29 C 14,30 9,30 5,29 L -10,34 L -6,21 C -15,19 -21,14 -24,8 Z"
          fill="url(#goldText)"/>
    <!-- Phone handset inside -->
    <path d="M -8,-6 C -6,-10 -3,-10 -1,-7 L 3,-1 C 5,2 4,4 1,6 C 0,7 6,14 12,16 C 14,14 16,13 19,16 L 23,21 C 25,24 24,27 21,28 C 17,30 11,29 3,21 C -5,14 -8,8 -8,-6 Z"
          fill="#0D0904"/>
  </g>

  <!-- Title & Subtitle -->
  <g filter="url(#shadow)">
    <text x="150" y="222" font-family="'Poppins', sans-serif" font-weight="900" font-size="24"
          fill="url(#goldText)" text-anchor="middle" letter-spacing="1">
      24x7 SUPPORT
    </text>
    <line x1="80" y1="236" x2="220" y2="236" stroke="url(#goldText)" stroke-width="1.5"/>
    <text x="150" y="258" font-family="'Poppins', sans-serif" font-weight="600" font-size="13"
          fill="#FFE899" text-anchor="middle" letter-spacing="3">
      INSTANT HELP
    </text>
  </g>
</svg>
