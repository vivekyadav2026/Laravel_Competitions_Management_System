<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 64 64" width="64" height="64">
  <defs>
    <linearGradient id="tGold" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#FFF59D"/>
      <stop offset="40%" stop-color="#FBC02D"/>
      <stop offset="80%" stop-color="#F57F17"/>
      <stop offset="100%" stop-color="#E65100"/>
    </linearGradient>
    <filter id="tGlow">
      <feDropShadow dx="0" dy="2" stdDeviation="2" flood-color="#FF8F00" flood-opacity="0.6"/>
    </filter>
  </defs>
  <!-- Trophy Cup -->
  <g filter="url(#tGlow)">
    <path d="M 18,12 L 46,12 L 42,34 C 40,42 34,46 32,46 C 30,46 24,42 22,34 Z" fill="url(#tGold)" stroke="#FFE082" stroke-width="1.2"/>
    <!-- Left Handle -->
    <path d="M 19,16 C 10,16 8,28 17,32" fill="none" stroke="url(#tGold)" stroke-width="3" stroke-linecap="round"/>
    <!-- Right Handle -->
    <path d="M 45,16 C 54,16 56,28 47,32" fill="none" stroke="url(#tGold)" stroke-width="3" stroke-linecap="round"/>
    <!-- Stem -->
    <rect x="29" y="46" width="6" height="8" fill="url(#tGold)"/>
    <!-- Base -->
    <path d="M 22,54 L 42,54 L 46,60 L 18,60 Z" fill="#2E1906" stroke="url(#tGold)" stroke-width="1.5"/>
    <!-- Star on cup -->
    <polygon points="32,20 34,25 39,25 35,28 36,33 32,30 28,33 29,28 25,25 30,25" fill="#FFF9C4"/>
  </g>
</svg>
