<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 300 300" width="300" height="300">
  <defs>
    <radialGradient id="bgSphere" cx="50%" cy="30%" r="70%">
      <stop offset="0%" stop-color="#1E2A4A"/>
      <stop offset="60%" stop-color="#0B132B"/>
      <stop offset="100%" stop-color="#040817"/>
    </radialGradient>
    <linearGradient id="goldPlate" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#FFF2A3"/>
      <stop offset="50%" stop-color="#FFD700"/>
      <stop offset="100%" stop-color="#8A5A00"/>
    </linearGradient>
    <filter id="shadow3d">
      <feDropShadow dx="0" dy="6" stdDeviation="5" flood-color="#000" flood-opacity="0.8"/>
    </filter>
    <style>
      @keyframes floatDie1 {
        0%, 100% { transform: translate(25px, 80px) rotate(-18deg); }
        50% { transform: translate(25px, 70px) rotate(-10deg) scale(1.06); }
      }
      @keyframes floatDie2 {
        0%, 100% { transform: translate(235px, 120px) rotate(22deg); }
        50% { transform: translate(235px, 110px) rotate(32deg) scale(1.06); }
      }
      @keyframes boardLevitate {
        0%, 100% { transform: translate(150px, 185px) scale(0.9, 0.55) rotate(45deg); }
        50% { transform: translate(150px, 178px) scale(0.92, 0.56) rotate(45deg); }
      }
      @keyframes sparkleTwinkle {
        0%, 100% { opacity: 0.2; transform: scale(0.7); }
        50% { opacity: 1; transform: scale(1.6); }
      }
      @keyframes textGlow {
        0%, 100% { filter: drop-shadow(0 0 2px rgba(255, 215, 0, 0.3)); }
        50% { filter: drop-shadow(0 0 8px rgba(255, 215, 0, 0.8)); }
      }
      #animRedDie { animation: floatDie1 3s ease-in-out infinite; }
      #animGoldDie { animation: floatDie2 3.4s ease-in-out infinite 0.5s; }
      #animBoard { animation: boardLevitate 4s ease-in-out infinite; }
      #animTitle { animation: textGlow 2.5s ease-in-out infinite; }
      .spk-1 { animation: sparkleTwinkle 2.2s infinite ease-in-out; transform-origin: 40px 50px; }
      .spk-2 { animation: sparkleTwinkle 2.6s infinite ease-in-out 0.8s; transform-origin: 260px 80px; }
      .spk-3 { animation: sparkleTwinkle 1.9s infinite ease-in-out 1.2s; transform-origin: 80px 220px; }
      .spk-4 { animation: sparkleTwinkle 2.4s infinite ease-in-out 0.4s; transform-origin: 240px 240px; }
    </style>
  </defs>

  <!-- Card Background -->
  <rect width="300" height="300" rx="20" fill="url(#bgSphere)"/>
  
  <!-- Outer subtle glowing border -->
  <rect x="2" y="2" width="296" height="296" rx="18" fill="none" stroke="#00D2FF" stroke-width="1.5" stroke-opacity="0.4"/>

  <!-- Starry sparkles background -->
  <circle cx="40" cy="50" r="2" fill="#FFF" class="spk-1"/>
  <circle cx="260" cy="80" r="2.2" fill="#FFF" class="spk-2"/>
  <circle cx="80" cy="220" r="1.8" fill="#00D2FF" class="spk-3"/>
  <circle cx="240" cy="240" r="2" fill="#FFD700" class="spk-4"/>

  <!-- 3D Perspective Ludo Board -->
  <g id="animBoard" transform="translate(150, 185) scale(0.9, 0.55) rotate(45)" filter="url(#shadow3d)">
    <!-- Board Base -->
    <rect x="-90" y="-90" width="180" height="180" rx="14" fill="#FFFFFF" stroke="url(#goldPlate)" stroke-width="6"/>
    <!-- Red Home Base (Top Left) -->
    <rect x="-85" y="-85" width="70" height="70" rx="8" fill="#EF4444"/>
    <circle cx="-50" cy="-50" r="22" fill="#FFFFFF"/>
    <circle cx="-50" cy="-50" r="16" fill="#DC2626"/>
    <!-- Green Home Base (Top Right) -->
    <rect x="15" y="-85" width="70" height="70" rx="8" fill="#10B981"/>
    <circle cx="50" cy="-50" r="22" fill="#FFFFFF"/>
    <circle cx="50" cy="-50" r="16" fill="#059669"/>
    <!-- Yellow Home Base (Bottom Right) -->
    <rect x="15" y="15" width="70" height="70" rx="8" fill="#F59E0B"/>
    <circle cx="50" cy="50" r="22" fill="#FFFFFF"/>
    <circle cx="50" cy="50" r="16" fill="#D97706"/>
    <!-- Blue Home Base (Bottom Left) -->
    <rect x="-85" y="15" width="70" height="70" rx="8" fill="#3B82F6"/>
    <circle cx="-50" cy="50" r="22" fill="#FFFFFF"/>
    <circle cx="-50" cy="50" r="16" fill="#2563EB"/>
    <!-- Center Triangles -->
    <polygon points="0,0 -15,-15 15,-15" fill="#10B981"/>
    <polygon points="0,0 15,-15 15,15" fill="#F59E0B"/>
    <polygon points="0,0 -15,15 15,15" fill="#3B82F6"/>
    <polygon points="0,0 -15,-15 -15,15" fill="#EF4444"/>
  </g>

  <!-- Left 3D Red Die -->
  <g id="animRedDie" transform="translate(25, 80) rotate(-18)" filter="url(#shadow3d)">
    <rect width="40" height="40" rx="8" fill="#DC2626" stroke="#FCA5A5" stroke-width="1.5"/>
    <circle cx="12" cy="12" r="3.5" fill="#FFF"/>
    <circle cx="28" cy="28" r="3.5" fill="#FFF"/>
    <circle cx="20" cy="20" r="3.5" fill="#FFF"/>
  </g>

  <!-- Right 3D Gold Die -->
  <g id="animGoldDie" transform="translate(235, 120) rotate(22)" filter="url(#shadow3d)">
    <rect width="38" height="38" rx="8" fill="url(#goldPlate)" stroke="#FFF" stroke-width="1.5"/>
    <circle cx="11" cy="11" r="3.2" fill="#451A03"/>
    <circle cx="27" cy="11" r="3.2" fill="#451A03"/>
    <circle cx="11" cy="27" r="3.2" fill="#451A03"/>
    <circle cx="27" cy="27" r="3.2" fill="#451A03"/>
  </g>

  <!-- Title Ribbon -->
  <g id="animTitle" filter="url(#shadow3d)">
    <text x="150" y="80" font-family="'Cinzel', 'Poppins', sans-serif" font-weight="900" font-size="24"
          fill="url(#goldPlate)" text-anchor="middle" letter-spacing="1.5">
      FSALUDOCLUB
    </text>
    <rect x="90" y="94" width="120" height="24" rx="12" fill="#000" stroke="#00D2FF" stroke-width="1"/>
    <text x="150" y="110" font-family="'Arial Black', sans-serif" font-weight="900" font-size="12"
          fill="#00D2FF" text-anchor="middle" letter-spacing="3">
      CLASSIC
    </text>
  </g>
</svg>
