<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 64 64" width="64" height="64">
  <defs>
    <linearGradient id="cashGrad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#4ADE80"/>
      <stop offset="50%" stop-color="#22C55E"/>
      <stop offset="100%" stop-color="#15803D"/>
    </linearGradient>
    <linearGradient id="backCashGrad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#166534"/>
      <stop offset="100%" stop-color="#14532D"/>
    </linearGradient>
    <filter id="cashShadow">
      <feDropShadow dx="0" dy="2" stdDeviation="2" flood-color="#000" flood-opacity="0.4"/>
    </filter>
  </defs>

  <!-- Back banknotes -->
  <rect x="14" y="12" width="42" height="26" rx="4" fill="url(#backCashGrad)" transform="rotate(-10 14 12)" opacity="0.7"/>
  <rect x="10" y="16" width="44" height="26" rx="4" fill="url(#backCashGrad)" transform="rotate(-4 10 16)" opacity="0.85"/>

  <!-- Front banknote -->
  <g filter="url(#cashShadow)">
    <rect x="6" y="20" width="52" height="30" rx="4" fill="url(#cashGrad)" stroke="#86EFAC" stroke-width="1.5"/>
    <!-- Outer dashed border -->
    <rect x="9" y="23" width="46" height="24" rx="2" fill="none" stroke="#DCFCE7" stroke-width="0.8" stroke-dasharray="2 1"/>
    <!-- Center oval emblem with rupee sign -->
    <ellipse cx="32" cy="35" rx="10" ry="8" fill="#15803D" stroke="#BBF7D0" stroke-width="1"/>
    <text x="32" y="39.5" font-family="'Arial', sans-serif" font-weight="900" font-size="13" fill="#DCFCE7" text-anchor="middle">₹</text>
    <!-- Corner stars -->
    <circle cx="12" cy="26" r="1.5" fill="#DCFCE7"/>
    <circle cx="52" cy="26" r="1.5" fill="#DCFCE7"/>
    <circle cx="12" cy="44" r="1.5" fill="#DCFCE7"/>
    <circle cx="52" cy="44" r="1.5" fill="#DCFCE7"/>
  </g>
</svg>
