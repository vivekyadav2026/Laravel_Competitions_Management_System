<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 64 64" width="64" height="64">
  <defs>
    <radialGradient id="sackGrad" cx="40%" cy="40%" r="60%">
      <stop offset="0%" stop-color="#FFB300"/>
      <stop offset="60%" stop-color="#E65100"/>
      <stop offset="100%" stop-color="#BF360C"/>
    </radialGradient>
    <linearGradient id="coinGrad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#FFF59D"/>
      <stop offset="60%" stop-color="#FBC02D"/>
      <stop offset="100%" stop-color="#F57F17"/>
    </linearGradient>
    <filter id="glow">
      <feDropShadow dx="0" dy="2" stdDeviation="2" flood-color="#FF6F00" flood-opacity="0.6"/>
    </filter>
  </defs>
  <!-- Tied Top of the sack -->
  <path d="M 24,18 C 24,11 20,6 20,6 C 20,6 28,11 32,11 C 36,11 44,6 44,6 C 44,6 40,11 40,18 Z" fill="url(#sackGrad)"/>
  <!-- Gold cord -->
  <path d="M 23,18 Q 32,23 41,18" stroke="#FFE082" stroke-width="3" fill="none" stroke-linecap="round"/>
  <!-- Sack body -->
  <path d="M 24,19 C 14,24 8,36 10,48 C 12,56 20,60 32,60 C 44,60 52,56 54,48 C 56,36 50,24 40,19 Z" fill="url(#sackGrad)" filter="url(#glow)"/>
  <!-- Shiny Gold Coin Badge in center with Rupee Symbol -->
  <circle cx="32" cy="40" r="12" fill="url(#coinGrad)" stroke="#FFE082" stroke-width="1.5"/>
  <text x="32" y="45" font-family="'Arial', sans-serif" font-weight="900" font-size="14" fill="#5D4037" text-anchor="middle">₹</text>
  <!-- Sparkles -->
  <path d="M 16,28 L 18,32 L 22,32 L 19,34 L 20,38 L 16,35 L 12,38 L 13,34 L 10,32 L 14,32 Z" fill="#FFF9C4" transform="scale(0.5) translate(14, 30)"/>
</svg>
