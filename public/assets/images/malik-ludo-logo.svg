<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 240 70" width="240" height="70">
  <defs>
    <linearGradient id="goldGrad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#fff1a8"/>
      <stop offset="35%" stop-color="#f6ca39"/>
      <stop offset="70%" stop-color="#d4af37"/>
      <stop offset="100%" stop-color="#9a7200"/>
    </linearGradient>
    <linearGradient id="bgGrad" x1="0%" y1="0%" x2="0%" y2="100%">
      <stop offset="0%" stop-color="#12182b"/>
      <stop offset="100%" stop-color="#070c18"/>
    </linearGradient>
    <filter id="goldGlow" x="-20%" y="-20%" width="140%" height="140%">
      <feGaussianBlur stdDeviation="3" result="blur" />
      <feComposite in="SourceGraphic" in2="blur" operator="over"/>
    </filter>
  </defs>

  <!-- Crown Icon at Top -->
  <g transform="translate(120, 2) scale(0.65)" text-anchor="middle">
    <!-- Glow behind crown -->
    <circle cx="0" cy="18" r="22" fill="#d4af37" opacity="0.25" filter="url(#goldGlow)"/>
    <!-- Crown shape -->
    <path d="M-28 30 L-22 6 L-8 20 L0 0 L8 20 L22 6 L28 30 Z" fill="url(#goldGrad)" stroke="#ffd700" stroke-width="1.2"/>
    <!-- Jewels on crown tips -->
    <circle cx="-22" cy="6" r="2.5" fill="#ffffff" stroke="#d4af37" stroke-width="1"/>
    <circle cx="0" cy="0" r="3.2" fill="#ef4444" stroke="#ffffff" stroke-width="0.8"/>
    <circle cx="22" cy="6" r="2.5" fill="#ffffff" stroke="#d4af37" stroke-width="1"/>
    <!-- Crown Base Band -->
    <rect x="-26" y="27" width="52" height="6" rx="2" fill="url(#goldGrad)" stroke="#fff1a8" stroke-width="0.8"/>
    <circle cx="-16" cy="30" r="1.5" fill="#00e5ff"/>
    <circle cx="0" cy="30" r="1.8" fill="#10b981"/>
    <circle cx="16" cy="30" r="1.5" fill="#00e5ff"/>
  </g>

  <!-- MALIK Text -->
  <text x="120" y="46" font-family="'Cinzel', 'Poppins', Georgia, serif" font-size="20" font-weight="900" fill="url(#goldGrad)" stroke="#1a1200" stroke-width="0.6" letter-spacing="3.5" text-anchor="middle" filter="url(#goldGlow)">
    MALIK
  </text>

  <!-- LUDO Text -->
  <text x="120" y="63" font-family="'Poppins', sans-serif" font-size="14" font-weight="900" fill="#ffffff" letter-spacing="4" text-anchor="middle">
    LUDO
  </text>
</svg>
