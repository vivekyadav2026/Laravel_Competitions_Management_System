<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 600 130" width="100%" height="100%">
  <defs>
    <linearGradient id="blueBanner" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#081838"/>
      <stop offset="40%" stop-color="#0D2C68"/>
      <stop offset="100%" stop-color="#040C1E"/>
    </linearGradient>
    <linearGradient id="neonCyan" x1="0%" y1="0%" x2="100%" y2="0%">
      <stop offset="0%" stop-color="#00D2FF"/>
      <stop offset="100%" stop-color="#3A7BD5"/>
    </linearGradient>
    <linearGradient id="goldText" x1="0%" y1="0%" x2="100%" y2="0%">
      <stop offset="0%" stop-color="#FFF275"/>
      <stop offset="100%" stop-color="#FFBA08"/>
    </linearGradient>
    <radialGradient id="glowG" cx="20%" cy="50%" r="50%">
      <stop offset="0%" stop-color="#00D2FF" stop-opacity="0.5"/>
      <stop offset="100%" stop-color="#00D2FF" stop-opacity="0"/>
    </radialGradient>
    <filter id="glowF">
      <feDropShadow dx="0" dy="2" stdDeviation="3" flood-color="#00D2FF" flood-opacity="0.6"/>
    </filter>
  </defs>

  <!-- Banner Container -->
  <rect x="2" y="2" width="596" height="126" rx="16" fill="url(#blueBanner)" stroke="#00D2FF" stroke-width="1.5" stroke-opacity="0.4"/>
  <rect x="6" y="6" width="588" height="118" rx="12" fill="url(#glowG)"/>

  <!-- Left: Speedometer Gauge Graphic -->
  <g transform="translate(70, 65)">
    <!-- Speedometer arc -->
    <path d="M -45,15 A 48 48 0 1 1 45,15" fill="none" stroke="#1E3A8A" stroke-width="8" stroke-linecap="round"/>
    <path d="M -45,15 A 48 48 0 0 1 20,-43" fill="none" stroke="#00D2FF" stroke-width="8" stroke-linecap="round" filter="url(#glowF)"/>
    <!-- Speed needle pointing fast right -->
    <polygon points="0,0 26,-36 4,-4" fill="#FF3B30"/>
    <circle cx="0" cy="0" r="7" fill="#FFF"/>
    <!-- Speed trails -->
    <path d="M -30,-15 L -60,-15 M -35,-30 L -62,-30" stroke="#00D2FF" stroke-width="2.5" stroke-linecap="round" opacity="0.8"/>
  </g>

  <!-- Middle: Text Content -->
  <g transform="translate(145, 0)">
    <text x="0" y="44" font-family="'Impact', 'Arial Black', sans-serif" font-weight="900" font-size="22" fill="#FFFFFF" letter-spacing="0.5">
      FASTEST WITHDRAWAL AND
    </text>
    <text x="0" y="74" font-family="'Impact', 'Arial Black', sans-serif" font-weight="900" font-size="24" fill="url(#goldText)" letter-spacing="1">
      SUPPORT SERVICE 24*7
    </text>
    <g transform="translate(0, 96)">
      <circle cx="6" cy="-4" r="4" fill="#00FF87"/>
      <text x="16" y="0" font-family="'Poppins', sans-serif" font-weight="600" font-size="12" fill="#93C5FD">
        24/7 SUPPORT • INSTANT PAYOUTS VIA UPI
      </text>
    </g>
  </g>

  <!-- Right: 24 Service Badge -->
  <g transform="translate(525, 65)" filter="url(#glowF)">
    <circle cx="0" cy="0" r="38" fill="#0A1E4A" stroke="#00D2FF" stroke-width="2.5"/>
    <text x="0" y="-2" font-family="'Impact', 'Arial Black', sans-serif" font-weight="900" font-size="26" fill="#FFFFFF" text-anchor="middle">
      24
    </text>
    <text x="0" y="16" font-family="'Poppins', sans-serif" font-weight="700" font-size="10" fill="#00D2FF" text-anchor="middle" letter-spacing="1">
      SERVICE
    </text>
  </g>
</svg>
